[package]
name = "liquid-glass"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "default_fonts"] }
rustix = { version = "1.1.5", features = ["fs", "mm", "event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
